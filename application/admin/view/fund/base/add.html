<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Fund_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-fund_id" data-rule="required" min="0" data-source="fund/index" class="form-control selectpage" name="row[fund_id]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Base_price')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-base_price" data-rule="required" class="form-control" step="0.0001" name="row[base_price]" type="number">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
