<div class="panel panel-default panel-intro">
    {:build_heading(null,FALSE)}
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="刷新"><i class="fa fa-refresh"></i> 刷新</a>
                        <a href="javascript:;" id="btn-mark-wipe" class="btn btn-danger btn-disabled disabled {:$auth->check('server/markWipe')?'':'hide'}"><i class="fa fa-eraser"></i> 标记清空</a>
                        <a href="javascript:;" id="btn-cancel-wipe" class="btn btn-warning btn-disabled disabled {:$auth->check('server/cancelWipe')?'':'hide'}"><i class="fa fa-undo"></i> 取消清空</a>
                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('server/del')?'':'hide'}" title="删除"><i class="fa fa-trash"></i> 删除</a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover"
                           data-operate-del="{:$auth->check('server/del')}"
                           width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
