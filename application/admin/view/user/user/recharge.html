<form id="recharge-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">会员:</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">{$row.nickname|htmlentities}（{$row.mobile|htmlentities}）</p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">当前到期:</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">{$expiretime_text}</p>
        </div>
    </div>
    <div class="form-group">
        <label for="c-days" class="control-label col-xs-12 col-sm-3">充值天数:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-days" data-rule="required;integer" class="form-control" name="days" type="number" min="1" value="30">
        </div>
    </div>
    <div class="form-group">
        <label for="c-amount" class="control-label col-xs-12 col-sm-3">金额(元):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-amount" class="form-control" name="amount" type="number" step="0.01" min="0" value="0">
        </div>
    </div>
    <div class="form-group">
        <label for="c-remark" class="control-label col-xs-12 col-sm-3">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-remark" class="form-control" name="remark" type="text" value="">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-3"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确认充值</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
